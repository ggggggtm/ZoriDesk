name: Sandbox baseline

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # CI-only toolchain preparation is authorized; local verification stays offline.
      - name: Set up Go from go.mod
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Download locked public Go modules
        run: go mod download
      - name: Run account-free baseline with race detection
        run: bash scripts/verify-sandbox.sh --race
      - name: Ensure dependency locks remain unchanged
        if: always()
        run: git diff --exit-code -- go.mod go.sum
