name: Sandbox baseline

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Use the runner's existing Go. An older toolchain fails explicitly rather
      # than installing tools or hiding this unmet prerequisite.
      - name: Download locked public Go modules
        run: go mod download
      - name: Run account-free baseline with race detection
        run: bash scripts/verify-sandbox.sh --race
      - name: Ensure dependency locks remain unchanged
        if: always()
        run: git diff --exit-code -- go.mod go.sum
